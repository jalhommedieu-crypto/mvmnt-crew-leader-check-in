<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MVMNT Crew Leader Check-In</title>
<style>
:root{font-family:Arial,sans-serif;color:#152443;background:#eef3ff;--blue:#1857c9}
*{box-sizing:border-box}body{margin:0}header{border-top:14px solid #d2d2d2;background:var(--blue);color:#f5f4f2;padding:40px 20px}header div,main{max-width:780px;margin:auto}header strong{letter-spacing:.1em}h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1.02;margin:12px 0}p{line-height:1.55}main{padding:22px 16px 50px}.card{background:#fff;border:1px solid #dae3f7;border-radius:14px;padding:22px;margin:0 0 16px}h2{margin:0 0 12px;color:var(--blue);font-size:1.35rem}h3{margin:16px 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:bold;margin-bottom:12px}input,select,textarea{display:block;width:100%;margin-top:6px;border:1px solid #9dadcb;border-radius:7px;padding:10px;background:#f8faff;color:#152443;font:inherit;font-weight:normal;min-height:44px}textarea{resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:10px}button{cursor:pointer;border:1px solid var(--blue);border-radius:8px;padding:12px 16px;color:white;background:var(--blue);font:inherit;font-weight:bold;min-height:44px}button+button{color:var(--blue);background:white}small{display:block;font-weight:normal;margin-top:3px;line-height:1.4}a,button,input,select,textarea{outline-offset:3px}@media(max-width:550px){.grid{grid-template-columns:1fr;gap:0}.card{padding:17px}}
.form-link{display:inline-block;background:var(--blue);color:#fff;border-radius:8px;padding:12px 16px;min-height:44px;font-weight:bold;text-decoration:none}.form-link:hover{text-decoration:underline}
</style>
</head>
<body>
<header><div><strong>MVMNT</strong><h1>CREW LEADER CHECK-IN</h1><p>We want to know how you’re doing and how we can support you and your Crew.</p></div></header>
<main>
<section class="card" aria-labelledby="check-in-heading">
<h2 id="check-in-heading">Complete your check-in</h2>
<p>Open the form to answer the check-in questions. Tap <strong>Submit</strong> when you’re done.</p>
<a class="form-link" href="https://docs.google.com/forms/d/e/1FAIpQLSfoif7NPATRIXBYllaatt98kmK7Miibj0wMjH0QCWNd_M9LIA/viewform?usp=publish-editor">Open check-in form</a>
</section>
</main>
</body>
</html>
